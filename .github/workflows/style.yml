name: Code Style

on: [pull_request, workflow_dispatch]

permissions:
   contents: read

jobs:
  formatting:
    name: CMake

    runs-on: "ubuntu-latest"

    env:
      UV_FROZEN: true

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true
        prune-cache: false
        python-version: '3.14'

    - name: Install dependencies
      run: |
        uv sync --group format --group types --no-install-project

    - name: Check types
      run: uv run --no-sync mypy python

    - name: Clang Format
      run: uv run --no-sync ./script/clang-format --check

    - name: CMake Format
      run: |
        find . -path './.venv' -prune -o \( -name 'CMakeLists.txt' -o -name '*.cmake' \) -print > cmake-src
        xargs uv run --no-sync cmake-format --check < cmake-src

    - name: pre-commit hooks
      run: |
        SKIP=no-commit-to-branch uv run --no-sync pre-commit run --all-files --show-diff-on-failure
