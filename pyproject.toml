[build-system]
requires = [
  "conan>=2",
  "scikit-build-core>=1.0",
  "setuptools_scm>=8",
]
build-backend = "backend"
backend-path = ["_custom_build"]

[project]
name = "resdata"
description = "Package for reading and writing the fortran result files from reservoir simulators"
authors = [{ name = "Equinor ASA", email = "fg_sib-scout@equinor.com" }]
license = "GPL-3.0-only"
readme = "README.md"
dynamic = ["version", "scripts"]
requires-python = ">=3.11"
dependencies = [
  "cwrap",
  "numpy",
  "pandas",
  "python-dateutil",
  "natsort",
  "typing_extensions",
  "resfo-utilities>=0.4.0",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Other Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/equinor/resdata"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[[tool.dynamic-metadata]]
provider = { path = "_custom_build", module = "metadata" }
field = "scripts"

[tool.setuptools_scm]
write_to = "python/resdata/version.py"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "_skbuild"
wheel.packages = ["python/resdata", "python/view_summary"]
ninja.make-fallback = false
sdist.include = ["python/resdata/version.py"]
sdist.exclude = [
  "**/.DS_Store",
  "**/__pycache__",
  "**/*.pyc",
  "/.cmake",
  "/CMakeCache.txt",
  "/CMakeFiles",
  "/CMakeInit.txt",
  "/CTestTestfile.cmake",
  "/build.ninja",
  "/cmake-build",
  "/cmake_install.cmake",
  "/applications/CTestTestfile.cmake",
  "/applications/cmake_install.cmake",
  "/lib/CTestTestfile.cmake",
  "/lib/cmake_install.cmake",
  "/lib/include/ert/util/build_config.hpp",
  "/lib/include/ert/util/ert_api_config.hpp",
  "/lib/include/ert/util/int_vector.hpp",
  "/lib/int_vector.cpp",
]

[tool.scikit-build.cmake.define]
BUILD_TESTS = "OFF"

[[tool.scikit-build.overrides]]
if.platform-system = "^linux"
cmake.define.BUILD_APPLICATIONS = "ON"

[dependency-groups]
build = [
  "cibuildwheel",
  "cwrap",
  "ninja",
  "numpy",
  "pandas",
  "scikit-build-core>=1.0",
  "setuptools_scm>=8",
  "sphinx!=3.4.0",
]
test = [
  "pytest",
  "pytest-benchmark",
  "pytest-timeout",
  "hypothesis[lark,numpy]",

  "pydantic",
  "resfo-utilities[testing]>=0.4.0",
  "numpy",
  "pandas",
]
types = ["mypy", "types-six"]
format = [
  "clang-format",
  "cmake-format",
  "pre-commit",
  "ruff"
  ]

[tool.uv]
fork-strategy = "requires-python"
exclude-newer = "7 days"

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
[tool.cibuildwheel]
build-frontend = "build[uv]"
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win32"

[tool.cibuildwheel.linux]
before-all = "yum install -y zlib-devel"
before-build = "rm -rf {package}/build"
test-groups = ["test"]
test-command = "pytest {package}/tests"

[tool.cibuildwheel.macos]
before-all = "brew install zlib"
before-build = "rm -rf {package}/build"
test-groups = ["test"]
test-command = "pytest {package}/tests"

[tool.cibuildwheel.windows]
before-build = "if exist {package}\\build rmdir /s /q {package}\\build"
repair-wheel-command = """
delvewheel repair \
  --add-path "{package}/_skbuild/bin/Release" \
  -w {dest_dir} -v {wheel}
"""
test-command = "python -c \"import resdata.grid\""

[tool.ruff.lint]
select = [
    "A",     # flake8-builtins
    "AIR",
    "ASYNC", # flake8-async
    "B",     # flake-8-bugbear
    "C4",    # flake8-comprehensions
    "DJ",
    "E",     # pycodestyle
    "F",     # pyflakes
    "FA",
    "FAST",
    "FLY",
    "FURB",  # refurb
    "G",     # logging-format
    "I",     # isort
    "ICN",   # flake8-import-conventions
    "INP",
    "INT",
    "LOG",   # logging
    "NPY",   # numpy specific rules
    "PIE",   # flake8-pie
    "PL",    # pylint
    "PYI",
    "Q",
    "RUF",   # ruff specific rules
    "SIM",   # flake-8-simplify
    "SLOT",
    "TID",
    "TRY203",
    "TRY300",
    "UP",    # pyupgrade
    "W",     # pycodestyle
